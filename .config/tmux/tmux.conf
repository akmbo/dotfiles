# Change prefix to Ctrl-Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 10

# Start numbering at 1
set -g base-index 1

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 3s
set -g display-time 3000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Set colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Vi key bindings for copy/scroll mode
setw -g mode-keys vi

# Focus events enabled for terminals that support them
set -g focus-events on

# Rather than constraining window size to the max size of any client
# connected to the seession, constrain window size to the max size of any
# client connected to that window
setw -g aggressive-resize on

# Capture and allow mouse bindings
set -g mouse on

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Source .tmux.conf as suggested in `man tmux`
bind R source-file "~/.config/tmux/tmux.conf" \; display "Reloaded!"

# Move between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane with vim keys
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r H resize-pane -L 10
bind-key -r L resize-pane -R 10

# create new panes/windows in the same directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
