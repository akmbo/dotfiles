[general]
live_config_reload = true
import = ["~/.config/alacritty/catppuccin/catppuccin-mocha.toml"]

# [terminal.shell]
# program = "/opt/homebrew/bin/bash"
# args = ["--login"]

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 120, lines = 36 }
dynamic_padding = true
title = "Terminal"

[window.padding]
x = 15
y = 10

[font]
size = 14.0

[font.bold]
family = "FiraCode Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Medium Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Medium"

[selection]
save_to_clipboard = true
